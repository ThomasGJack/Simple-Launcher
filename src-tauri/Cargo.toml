[package]
name = "simple-launcher"
version = "26.427.19"
description = "Simple Launcher — multi-game launcher"
authors = ["goule"]
edition = "2021"

[lib]
name = "simple_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 with `tray-icon` to enable the system-tray (`TrayIconBuilder`) APIs
# and `image-png` so we can decode the embedded logo for the tray icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "macros", "sync", "time", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
discord-rich-presence = "1.1"

