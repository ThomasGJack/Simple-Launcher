[package]
name = "simple-launcher"
version = "26.508.0"
description = "Simple Launcher — multi-game launcher"
authors = ["goule"]
edition = "2021"

[lib]
name = "simple_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `custom-protocol` est CRITIQUE pour les builds release. La feature
# active le custom protocol Tauri qui sert le frontend depuis les
# fichiers embedded (frontendDist) au lieu de proxy vers le devUrl
# (http://localhost:1420). Sans cette feature, le binaire compilé en
# release loadera localhost et plantera chez les users qui n'ont pas
# de Vite dev server tournant.
#
# Tauri CLI forwarde automatiquement `--features custom-protocol`
# quand on appelle `tauri build`. Cargo n'utilise pas cette feature
# pendant `cargo run` / `cargo build` (sans --release), donc le dev
# loop continue de fonctionner via le devUrl normalement.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 with `tray-icon` to enable the system-tray (`TrayIconBuilder`) APIs
# and `image-png` so we can decode the embedded logo for the tray icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Auto-updater : Velopack remplace tauri-plugin-updater à partir de
# la v27. Velopack apporte les delta updates (~3-5 MB par release au
# lieu de ~80 MB), un installer custom (plus de dialog NSIS), et la
# robustesse atomique (rollback si install échoue). Le crate expose
# `VelopackApp` (à appeler AVANT Tauri pour intercepter les hooks
# d'install/update) et `UpdateManager` (pour check/download/apply
# depuis l'app).
velopack = "0.0.1589-ga2c5a97"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Single-instance enforcement is now done manually via Win32 named
# mutex + named event (see `single_instance.rs`). The official
# `tauri-plugin-single-instance` plugin used loopback TCP for argv
# forwarding which failed in some setups (corporate AV, multi-NIC,
# UAC elevation differences) — the manual implementation only relies
# on kernel objects and works regardless of those edge cases.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "macros", "sync", "time", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
discord-rich-presence = "1.1"
base64 = "0.22"
rand = "0.8"
# OS-native secret store (Windows Credential Manager / macOS Keychain /
# Linux Secret Service). Used to encrypt-at-rest the Microsoft refresh
# tokens used by `mc_auth` so a hand-edited `mc_accounts.json` no longer
# leaks usable session material.
keyring = "3"
# Standard cross-platform "well-known directory" lookups. Used by
# `mc_github` to find a stable per-user app-data path for the PAT
# fallback file when keyring write+verify fails.
dirs = "5"
# Cross-platform system information : RAM, CPU, disks. Used by
# `diagnostic.rs` to power the "Diagnostic système" modal in Settings
# (helps users self-debug "le launcher marche pas" issues by surfacing
# OS version, free RAM, free disk space, etc.).
sysinfo = "0.32"
# In-game overlay : binds a global hotkey (default Shift+F9) that
# toggles a transparent always-on-top window over any running game in
# borderless/windowed mode. The shortcut is registered OS-wide via
# `RegisterHotKey` on Windows so it triggers even when the game has
# focus. See `overlay.rs`.
tauri-plugin-global-shortcut = "2"
# WebSocket client pour l'intégration OBS — `obs-websocket` plugin écoute
# par défaut sur ws://localhost:4455 et expose un protocole OBS-WebSocket
# v5 (RFC 6455 + handshake auth SHA-256 challenge). Utilisé par `obs_ws.rs`
# pour broadcast des events overlay (achievement, friend online, etc.)
# depuis le launcher vers OBS Studio chez le streamer.
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
# Screenshot capture cross-platform — utilisé par `screenshot.rs`
# pour la commande Tauri `screenshot_capture` qui capture l'écran
# (utilise GDI BitBlt sur Windows). Pas de dialog / no-op si appelé
# sans display.
screenshots = "0.8"
# Encoding PNG pour sérialiser la capture en bytes avant retour
# au frontend (qui sauve sur disque ou affiche).
image = { version = "0.25", default-features = false, features = ["png"] }
# Win32 bindings — used by `single_instance.rs` to enforce only one
# instance of Simple Launcher running at a time via a kernel-level
# named mutex + a named event for cross-process "show window" IPC.
# `tauri-plugin-single-instance` 2.4.2 was unreliable in some setups
# (UAC elevation difference, antivirus locking the IPC pipe) — the
# manual implementation works regardless of those edge cases.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

