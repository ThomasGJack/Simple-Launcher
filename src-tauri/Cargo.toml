[package]
name = "simple-launcher"
version = "26.506.1"
description = "Simple Launcher — multi-game launcher"
authors = ["goule"]
edition = "2021"

[lib]
name = "simple_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 with `tray-icon` to enable the system-tray (`TrayIconBuilder`) APIs
# and `image-png` so we can decode the embedded logo for the tray icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Single-instance enforcement is now done manually via Win32 named
# mutex + named event (see `single_instance.rs`). The official
# `tauri-plugin-single-instance` plugin used loopback TCP for argv
# forwarding which failed in some setups (corporate AV, multi-NIC,
# UAC elevation differences) — the manual implementation only relies
# on kernel objects and works regardless of those edge cases.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "macros", "sync", "time", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
discord-rich-presence = "1.1"
base64 = "0.22"
rand = "0.8"
# OS-native secret store (Windows Credential Manager / macOS Keychain /
# Linux Secret Service). Used to encrypt-at-rest the Microsoft refresh
# tokens used by `mc_auth` so a hand-edited `mc_accounts.json` no longer
# leaks usable session material.
keyring = "3"
# Standard cross-platform "well-known directory" lookups. Used by
# `mc_github` to find a stable per-user app-data path for the PAT
# fallback file when keyring write+verify fails.
dirs = "5"
# Cross-platform system information : RAM, CPU, disks. Used by
# `diagnostic.rs` to power the "Diagnostic système" modal in Settings
# (helps users self-debug "le launcher marche pas" issues by surfacing
# OS version, free RAM, free disk space, etc.).
sysinfo = "0.32"
# In-game overlay : binds a global hotkey (default Shift+F9) that
# toggles a transparent always-on-top window over any running game in
# borderless/windowed mode. The shortcut is registered OS-wide via
# `RegisterHotKey` on Windows so it triggers even when the game has
# focus. See `overlay.rs`.
tauri-plugin-global-shortcut = "2"
# Win32 bindings — used by `single_instance.rs` to enforce only one
# instance of Simple Launcher running at a time via a kernel-level
# named mutex + a named event for cross-process "show window" IPC.
# `tauri-plugin-single-instance` 2.4.2 was unreliable in some setups
# (UAC elevation difference, antivirus locking the IPC pipe) — the
# manual implementation works regardless of those edge cases.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

