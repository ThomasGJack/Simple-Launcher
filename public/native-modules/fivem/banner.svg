<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Dark background gradient — Los Santos sunset à la FiveM brand -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="50%" stop-color="#1a0d14"/>
      <stop offset="100%" stop-color="#2b0a1a"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a3d"/>
      <stop offset="55%" stop-color="#f40552"/>
      <stop offset="100%" stop-color="#bd0a4c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f40552" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f40552" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f40552" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#grid)"/>
  <rect width="600" height="900" fill="url(#halo)"/>

  <!-- Subtle skyline silhouette at bottom -->
  <g fill="#000000" fill-opacity="0.45" transform="translate(0, 720)">
    <rect x="0"   y="40" width="38" height="140"/>
    <rect x="42"  y="65" width="48" height="115"/>
    <rect x="94"  y="20" width="56" height="160"/>
    <rect x="154" y="78" width="32" height="102"/>
    <rect x="190" y="50" width="50" height="130"/>
    <rect x="244" y="10" width="60" height="170"/>
    <rect x="308" y="55" width="44" height="125"/>
    <rect x="356" y="30" width="52" height="150"/>
    <rect x="412" y="68" width="38" height="112"/>
    <rect x="454" y="45" width="56" height="135"/>
    <rect x="514" y="22" width="40" height="158"/>
    <rect x="558" y="60" width="42" height="120"/>
  </g>

  <!-- "FiveM" wordmark, stylized -->
  <g transform="translate(300, 360)">
    <text x="0" y="0"
          text-anchor="middle"
          font-family="'Audiowide', 'Trebuchet MS', sans-serif"
          font-size="120"
          font-weight="900"
          fill="url(#logo)"
          letter-spacing="-2">
      FiveM
    </text>
    <text x="0" y="58"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-size="22"
          font-weight="600"
          fill="#ffffff"
          fill-opacity="0.9"
          letter-spacing="6">
      GTA V MULTIPLAYER
    </text>
    <text x="0" y="92"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-size="14"
          font-weight="500"
          fill="#ffffff"
          fill-opacity="0.55"
          letter-spacing="3">
      Serveurs RP · Drift · Race · DM
    </text>
  </g>

  <!-- Bottom edge fade -->
  <rect x="0" y="780" width="600" height="120" fill="url(#bg)" opacity="0.6"/>
</svg>
