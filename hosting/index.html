<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Launcher</title>
    <style>
      body {
        background: #07090d;
        color: #f5f7fa;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .card {
        padding: 32px 48px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
      }
      h1 {
        margin: 0 0 8px;
        font-weight: 500;
      }
      p {
        margin: 0;
        color: #97a3b6;
      }
      a {
        color: #00d4ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Simple Launcher</h1>
      <p>Backend de mise à jour. Si tu vois cette page, le hosting est actif.</p>
    </div>
  </body>
</html>
